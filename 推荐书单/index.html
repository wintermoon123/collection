<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>推荐书单 · oo的主页</title>
  <meta name="description" content="oo 的推荐书单：社会科学与心理自助两类值得一读的书，点击封面直达豆瓣。">
  <style>
    /* ============ Design tokens（与主页同一套） ============ */
    :root {
      --bg: #FAFAF8;
      --surface: #FFFFFF;
      --surface-2: #F2F2EE;
      --text: #111827;
      --text-muted: #374151;
      --border: #6B7280;
      --border-soft: #D4D4CE;
      --primary: #1E40AF;
      --primary-hover: #172E7E;
      --on-primary: #FFFFFF;
      --focus: #B91C1C;
      --shadow: 0 1px 2px rgba(17,24,39,.06), 0 8px 24px rgba(17,24,39,.05);
      --tag-blue-bg: #DBEAFE; --tag-blue-text: #1E3A8A;
      --tag-mint-bg: #D1FAE5; --tag-mint-text: #14532D;
      --tag-peach-bg: #FCE7D3; --tag-peach-text: #7C2D12;
      --tag-purple-bg: #EDE9FE; --tag-purple-text: #5B21B6;
      --rating: #B45309;
      --radius: 14px;
      --wrap: 1120px;
    }
    [data-theme="dark"] {
      --bg: #0C1424;
      --surface: #142033;
      --surface-2: #1B2A41;
      --text: #F8FAFC;
      --text-muted: #D5DEEB;
      --border: #94A3B8;
      --border-soft: #334155;
      --primary: #93C5FD;
      --primary-hover: #BFDBFE;
      --on-primary: #0C1424;
      --focus: #FCA5A5;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.25);
      --tag-blue-bg: #1E3A8A; --tag-blue-text: #DBEAFE;
      --tag-mint-bg: #14532D; --tag-mint-text: #D1FAE5;
      --tag-peach-bg: #7C2D12; --tag-peach-text: #FCE7D3;
      --tag-purple-bg: #5B21B6; --tag-purple-text: #EDE9FE;
      --rating: #FCD34D;
    }

    /* ============ Base ============ */
    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", "Segoe UI", sans-serif;
      font-size: 17px;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
    }
    img { max-width: 100%; display: block; }
    a { color: var(--primary); }
    h1, h2, h3 { line-height: 1.25; letter-spacing: -0.02em; }
    h1 { font-size: clamp(2.4rem, 6vw, 4rem); margin: 0 0 18px; }
    html[lang="ja"] h1 { font-size: clamp(1.9rem, 4.2vw, 2.8rem); }
    h2 { font-size: clamp(1.9rem, 4.5vw, 2.6rem); margin: 0 0 12px; }
    p { margin: 0 0 16px; }
    .wrap { width: min(var(--wrap), calc(100% - 48px)); margin-inline: auto; }
    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
    }

    /* ============ Accessibility ============ */
    .skip-link {
      position: absolute; left: 16px; top: -100px; z-index: 1000;
      background: var(--primary); color: var(--on-primary);
      padding: 12px 20px; border-radius: 8px; font-weight: 700; text-decoration: none;
    }
    .skip-link:focus { top: 12px; }
    :focus-visible { outline: 4px solid var(--focus); outline-offset: 3px; border-radius: 4px; }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
      .reveal { opacity: 1 !important; transform: none !important; }
    }

    /* ============ Header ============ */
    .site-header {
      position: sticky; top: 0; z-index: 50;
      background: color-mix(in srgb, var(--bg) 92%, transparent);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border-soft);
    }
    .header-inner { display: flex; align-items: center; gap: 24px; min-height: 72px; }
    .brand { display: inline-flex; align-items: center; gap: 10px; color: var(--text); text-decoration: none; font-weight: 800; font-size: 1.2rem; letter-spacing: -0.03em; }
    .brand-mark { width: 30px; height: 30px; display: grid; place-items: center; background: none; color: var(--text); }
    .brand-mark svg { width: 26px; height: 26px; }
    .site-nav { margin-left: auto; display: flex; gap: 4px; align-items: center; }
    .site-nav a {
      color: var(--text-muted); text-decoration: none; font-weight: 600;
      padding: 10px 14px; border-radius: 8px; min-height: 44px; display: inline-flex; align-items: center;
    }
    .site-nav a:hover { background: var(--surface-2); color: var(--text); }
    .site-nav a[aria-current="page"] { color: var(--primary); background: var(--tag-blue-bg); }
    .icon-btn {
      width: 44px; height: 44px; display: grid; place-items: center;
      background: var(--surface); color: var(--text); border: 2px solid var(--border);
      border-radius: 10px; cursor: pointer;
    }
    .icon-btn:hover { background: var(--surface-2); }
    .icon-btn svg { width: 20px; height: 20px; }

    /* ============ Language switcher ============ */
    .header-tools { display: flex; align-items: center; gap: 10px; }
    .lang-wrap { position: relative; }
    .lang-btn {
      display: inline-flex; align-items: center; gap: 7px;
      height: 44px; padding: 0 11px; border: 2px solid var(--border); border-radius: 10px;
      background: var(--surface); color: var(--text); font-weight: 700; font-size: .92rem;
      cursor: pointer; font-family: inherit;
    }
    .lang-btn:hover { background: var(--surface-2); }
    .lang-btn .globe { width: 18px; height: 18px; flex: none; }
    .lang-btn .chev { width: 12px; height: 12px; flex: none; opacity: .65; transition: transform .18s ease; }
    .lang-btn[aria-expanded="true"] .chev { transform: rotate(180deg); }
    .lang-menu {
      position: absolute; right: 0; top: calc(100% + 8px); z-index: 60;
      min-width: 168px; margin: 0; padding: 6px; list-style: none;
      background: var(--surface); border: 2px solid var(--border); border-radius: 12px;
      box-shadow: var(--shadow);
    }
    .lang-menu[hidden] { display: none; }
    .lang-menu button {
      width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 10px;
      padding: 10px 12px; border: 0; border-radius: 8px; background: none; color: var(--text);
      font-family: inherit; font-size: .92rem; font-weight: 600; text-align: left; cursor: pointer;
    }
    .lang-menu button:hover, .lang-menu button:focus-visible { background: var(--surface-2); }
    .lang-menu button[aria-checked="true"] { font-weight: 800; }
    .lang-menu button[aria-checked="true"]::after { content: "✓"; font-weight: 800; color: var(--primary); }

    /* ============ Hero ============ */
    .hero { padding: 64px 0 56px; border-bottom: 1px solid var(--border-soft); }
    .hero h1 { margin-bottom: 0; }
    .eyebrow {
      display: inline-flex; align-items: center; gap: 8px;
      font-size: .85rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase;
      color: var(--primary); margin-bottom: 18px;
    }

    /* ============ Sections ============ */
    section { padding: 88px 0; }
    #list { padding: 56px 0 80px; }
    .section-head { margin-bottom: 26px; max-width: 60ch; }

    /* ============ Tabs ============ */
    .tabs {
      display: inline-flex; flex-wrap: wrap; gap: 6px; padding: 6px;
      background: var(--surface-2); border: 2px solid var(--border-soft);
      border-radius: 12px; margin-bottom: 26px;
    }
    .tab {
      appearance: none; border: 0; cursor: pointer; font-family: inherit;
      font-weight: 700; font-size: .95rem;
      color: var(--text-muted); background: transparent;
      padding: 9px 18px; border-radius: 8px; min-height: 44px;
      display: inline-flex; align-items: center; gap: 8px;
      transition: background .18s ease, color .18s ease;
    }
    .tab:hover { color: var(--text); }
    .tab[aria-selected="true"] { background: var(--surface); color: var(--primary); box-shadow: var(--shadow); }
    .tab-count {
      font-size: .76rem; font-weight: 800; padding: 1px 8px; border-radius: 999px;
      background: var(--tag-blue-bg); color: var(--tag-blue-text);
    }

    /* ============ Book cards（沿用主页卡片语言） ============ */
    .books { display: grid; grid-template-columns: repeat(5, 1fr); gap: 16px; }
    .book {
      background: var(--surface); border: 2px solid var(--border-soft);
      border-radius: var(--radius); overflow: hidden; display: flex; flex-direction: column;
      text-decoration: none; color: inherit;
      transition: transform .2s ease, border-color .2s ease, box-shadow .2s ease;
    }
    .book:hover { transform: translateY(-4px); border-color: var(--text); box-shadow: var(--shadow); }
    .book-cover {
      position: relative; aspect-ratio: 3 / 4; overflow: hidden;
      background: var(--surface-2); border-bottom: 2px solid var(--border-soft);
    }
    .book-cover img { width: 100%; height: 100%; object-fit: contain; object-position: center; transition: transform .35s ease; }
    .book:hover .book-cover img { transform: scale(1.04); }
    .book-rating {
      position: absolute; right: 8px; top: 8px;
      background: color-mix(in srgb, var(--surface) 92%, transparent);
      color: var(--rating); font-weight: 800; font-size: .74rem;
      padding: 2px 7px; border-radius: 999px; border: 1px solid var(--border-soft);
      backdrop-filter: blur(4px);
    }
    .book-body { padding: 13px 14px 15px; display: flex; flex-direction: column; flex: 1; }
    .book-title { font-size: .96rem; font-weight: 800; margin: 0 0 3px; line-height: 1.35; }
    .book-author { color: var(--text-muted); font-size: .78rem; font-weight: 600; margin: 0 0 8px; }
    .book-desc { color: var(--text-muted); font-size: .8rem; line-height: 1.5; margin: 0 0 12px; flex: 1; }
    .book-link {
      margin-top: auto; display: inline-flex; align-items: center; justify-content: space-between; gap: 8px;
      min-height: 38px; padding: 6px 11px; border: 2px solid var(--primary); border-radius: 8px;
      color: var(--primary); font-weight: 800; font-size: .82rem;
    }
    .book:hover .book-link { background: var(--primary); color: var(--on-primary); }
    .book-link svg { width: 15px; height: 15px; }
    .book-empty {
      grid-column: 1 / -1; text-align: center; color: var(--text-muted); padding: 44px 20px;
      border: 2px dashed var(--border); border-radius: var(--radius);
    }

    /* ============ Footer ============ */
    .site-footer { border-top: 1px solid var(--border-soft); padding: 30px 0; color: var(--text-muted); font-size: .9rem; }
    .footer-inner { display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: center; }
    .footer-inner a { color: var(--text-muted); text-decoration: none; font-weight: 600; }
    .footer-inner a:hover { color: var(--primary); }

    /* ============ Reveal ============ */
    .reveal { opacity: 0; transform: translateY(16px); transition: opacity .45s ease, transform .45s ease; }
    .reveal.in { opacity: 1; transform: none; }

    /* ============ Responsive ============ */
    @media (max-width: 1080px) { .books { grid-template-columns: repeat(4, 1fr); } }
    @media (max-width: 900px) { .books { grid-template-columns: repeat(3, 1fr); } }
    @media (max-width: 680px) {
      body { font-size: 16px; }
      .wrap { width: min(var(--wrap), calc(100% - 32px)); }
      .header-inner { flex-wrap: wrap; gap: 8px 12px; padding: 10px 0; min-height: 0; }
      .header-tools { margin-left: auto; }
      .site-nav { order: 3; width: 100%; margin-left: 0; gap: 2px; overflow-x: auto; -webkit-overflow-scrolling: touch; }
      .site-nav a { padding: 8px 10px; font-size: .9rem; white-space: nowrap; }
      .hero { padding: 40px 0 44px; }
      #list { padding: 40px 0 56px; }
      .books { grid-template-columns: repeat(2, 1fr); gap: 14px 12px; }
      .book-body { padding: 11px 12px 13px; }
      .book-title { font-size: .92rem; }
      .book-author { font-size: .75rem; margin-bottom: 7px; }
      .book-desc { font-size: .78rem; margin-bottom: 10px; }
      .book-link { font-size: .8rem; min-height: 36px; padding: 6px 10px; }
    }
    @media (max-width: 400px) {
      .books { gap: 12px 10px; }
      .book-body { padding: 10px 11px 12px; }
      .book-title { font-size: .88rem; }
      .book-desc { font-size: .74rem; }
      .book-link { font-size: .76rem; padding: 5px 9px; }
    }
  </style>
</head>

          '跳到主要内容': '본문으로 건너뛰기', '03 / 书单': '03 / 추천 도서', '推荐书单': '추천 도서 목록',
          '社会科学': '사회과학', '心理自助': '자기계발', '书单分类': '도서 분류',
          '回到顶部 ↑': '맨 위로 ↑', 'oo的主页，返回主页': 'oo의 홈, 홈으로 돌아가기', '主导航': '주 메뉴',
          '书单正在加载……': '목록을 불러오는 중…'
        },
        'ja': {
          'oo的主页': 'oo のホーム', '作品': '作品', '10 问': '10 の問い', '书单': '推薦図書',
          '跳到主要内容': 'メインコンテンツへスキップ', '03 / 书单': '03 / 推薦図書', '推荐书单': '推薦図書リスト',
          '社会科学': '社会科学', '心理自助': '自己啓発', '书单分类': '図書の分類',
          '回到顶部 ↑': 'トップへ戻る ↑', 'oo的主页，返回主页': 'oo のホーム、ホームへ戻る', '主导航': 'メインナビ',
          '书单正在加载……': 'リストを読み込み中…'
        }
      };

      var currentLang = 'zh-Hans';

      function norm(s) { return s.replace(/\s+/g, ' ').trim(); }

      var textNodes = [];
      (function () {
        var walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, {
          acceptNode: function (n) {
            if (!n.nodeValue || !n.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
            var p = n.parentElement;
            if (!p || p.closest('.tab-count')) return NodeFilter.FILTER_REJECT;
            if (p.tagName === 'SCRIPT' || p.tagName === 'STYLE') return NodeFilter.FILTER_REJECT;
            return NodeFilter.FILTER_ACCEPT;
          }
        });
        var n;
        while ((n = walker.nextNode())) textNodes.push({ node: n, orig: n.nodeValue, key: norm(n.nodeValue) });
      })();

      var attrTargets = [];
      document.querySelectorAll('[aria-label],[alt],[title]').forEach(function (el) {
        if (el.id === 'themeToggle' || el.id === 'langBtn') return;
        ['aria-label', 'alt', 'title'].forEach(function (a) {
          if (el.hasAttribute(a)) attrTargets.push({ el: el, attr: a, orig: el.getAttribute(a) });
        });
      });

      var stored = null;
      try { stored = localStorage.getItem('oo-design-theme'); } catch (e) {}
      var theme = stored === 'dark' || stored === 'light' ? stored : 'light';

      function applyTheme(next) {
        var ui = UI[currentLang] || UI['zh-Hans'];
        root.setAttribute('data-theme', next);
        var isDark = next === 'dark';
        toggle.setAttribute('aria-pressed', String(isDark));
        toggle.setAttribute('aria-label', isDark ? ui.themeLight : ui.themeDark);
        toggle.setAttribute('title', isDark ? ui.themeLight : ui.themeDark);
        icon.innerHTML = isDark
          ? '<circle cx="12" cy="12" r="4.2"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/>'
          : '<path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/>';
        try { localStorage.setItem('oo-design-theme', next); } catch (e) {}
      }

      // ===== 书单渲染 =====
      var grid = document.getElementById('bookGrid');
      var panel = document.getElementById('bookPanel');
      var tabsEl = document.getElementById('bookTabs');
      var books = window.RECOMMEND_BOOKS || [];
      var CATS = (window.RECOMMEND_CATS && window.RECOMMEND_CATS.length)
        ? window.RECOMMEND_CATS.slice()
        : books.map(function (b) { return b.cat; }).filter(function (c, i, a) { return a.indexOf(c) === i; });
      var activeCat = CATS[0];

      /* 分类名的多语言（分类键本身用中文，展示时按语言取词） */
      var CAT_LABEL = {
        '社会科学': { 'zh-Hant': '社會科學', en: 'Social science', ko: '사회과학', ja: '社会科学' },
        '心理自助': { 'zh-Hant': '心理自助', en: 'Self-help', ko: '자기계발', ja: '自己啓発' },
        '历史':     { 'zh-Hant': '歷史', en: 'History', ko: '역사', ja: '歴史' },
        '商业':     { 'zh-Hant': '商業', en: 'Business', ko: '비즈니스', ja: 'ビジネス' },
        '纪实':     { 'zh-Hant': '紀實', en: 'Reportage', ko: '르포', ja: 'ルポ' },
        '思考工具': { 'zh-Hant': '思考工具', en: 'Thinking tools', ko: '사고 도구', ja: '思考の道具' }
      };

      function catLabel(cat) {
        var m = CAT_LABEL[cat];
        return (m && m[currentLang]) || cat;
      }

      function el(tag, cls, text) {
        var n = document.createElement(tag);
        if (cls) n.className = cls;
        if (text != null) n.textContent = text;
        return n;
      }

      function makeBook(b) {
        var L = BOOK_UI[currentLang] || BOOK_UI['zh-Hans'];
        var a = el('a', 'book reveal');
        a.href = b.url;
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        a.setAttribute('aria-label', L.aria.replace('{t}', b.title));

        var cover = el('div', 'book-cover');
        if (b.cover) {
          var img = el('img');
          img.src = b.cover;
          img.alt = b.title;
          img.loading = 'lazy';
          cover.appendChild(img);
        }
        if (b.rating) cover.appendChild(el('span', 'book-rating', '★ ' + b.rating));
        a.appendChild(cover);

        var body = el('div', 'book-body');
        body.appendChild(el('h3', 'book-title', b.title));
        body.appendChild(el('p', 'book-author', b.author + (b.year ? ' · ' + b.year : '')));
        if (b.desc) body.appendChild(el('p', 'book-desc', b.desc));

        var link = el('span', 'book-link');
        link.appendChild(el('span', '', L.view));
        link.insertAdjacentHTML('beforeend', '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7M8 7h9v9"/></svg>');
        body.appendChild(link);
        a.appendChild(body);
        return a;
      }

      function render(cat) {
        var L = BOOK_UI[currentLang] || BOOK_UI['zh-Hans'];
        grid.innerHTML = '';
        var list = books.filter(function (b) { return b.cat === cat; });
        if (!list.length) {
          grid.appendChild(el('p', 'book-empty', L.empty));
          return;
        }
        list.forEach(function (b) { grid.appendChild(makeBook(b)); });
        revealCards();
      }

      function count(cat) { return books.filter(function (b) { return b.cat === cat; }).length; }

      /* 分类标签由数据驱动，加书后自动出现；空分类也保留标签 */
      function buildTabs() {
        tabsEl.innerHTML = '';
        CATS.forEach(function (cat, i) {
          var b = el('button', 'tab');
          b.type = 'button';
          b.setAttribute('role', 'tab');
          b.id = 'tab-' + i;
          b.setAttribute('aria-controls', 'bookPanel');
          b.setAttribute('aria-selected', String(cat === activeCat));
          b.setAttribute('data-cat', cat);
          b.appendChild(document.createTextNode(catLabel(cat)));
          var n = count(cat);
          if (n > 0) {
            b.appendChild(document.createTextNode(' '));
            b.appendChild(el('span', 'tab-count', String(n)));
          }
          b.addEventListener('click', function () { selectTab(cat); });
          b.addEventListener('keydown', onTabKey);
          tabsEl.appendChild(b);
        });
        syncPanel();
      }

      function selectTab(cat) {
        activeCat = cat;
        Array.prototype.forEach.call(tabsEl.children, function (t) {
          t.setAttribute('aria-selected', String(t.getAttribute('data-cat') === cat));
        });
        syncPanel();
        render(cat);
      }

      function syncPanel() {
        var cur = tabsEl.querySelector('.tab[aria-selected="true"]');
        var i = CATS.indexOf(activeCat);
        if (cur) panel.setAttribute('aria-labelledby', cur.id);
        else if (i >= 0) panel.setAttribute('aria-labelledby', 'tab-' + i);
      }

      function onTabKey(e) {
        if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
        e.preventDefault();
        var list = Array.prototype.slice.call(tabsEl.children);
        var i = list.indexOf(e.currentTarget);
        var next = list[(i + (e.key === 'ArrowRight' ? 1 : list.length - 1)) % list.length];
        if (next) { next.focus(); next.click(); }
      }

      function revealCards() {
        var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        var items = grid.querySelectorAll('.reveal');
        if (reduce || !('IntersectionObserver' in window)) {
          items.forEach(function (n) { n.classList.add('in'); });
        } else {
          var io = new IntersectionObserver(function (es) {
            es.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } });
          }, { threshold: 0.1 });
          items.forEach(function (n) { io.observe(n); });
        }
      }

      // ===== 语言 =====
      function applyLang(code) {
        currentLang = code;
        var dict = TEXT[code] || null;
        var lang = LANGS.filter(function (l) { return l.code === code; })[0] || LANGS[0];
        var ui = UI[code] || UI['zh-Hans'];
        root.setAttribute('lang', lang.tag);

        textNodes.forEach(function (t) {
          if (!dict) { t.node.nodeValue = t.orig; return; }
          var tr = dict[t.key];
          t.node.nodeValue = (tr != null) ? tr : t.orig;
        });

        attrTargets.forEach(function (a) {
          if (!dict) { a.el.setAttribute(a.attr, a.orig); return; }
          var tr = dict[a.orig];
          a.el.setAttribute(a.attr, (tr != null) ? tr : a.orig);
        });

        document.title = ui.title;
        var md = document.querySelector('meta[name="description"]');
        if (md) md.setAttribute('content', ui.desc);

        langCurrent.textContent = lang.short;
        langBtn.setAttribute('aria-label', ui.langAria);
        langMenu.setAttribute('aria-label', ui.langMenuLabel);

        langMenu.querySelectorAll('button[data-lang]').forEach(function (b) {
          b.setAttribute('aria-checked', String(b.getAttribute('data-lang') === code));
        });

        applyTheme(theme);
        try { localStorage.setItem('oo-design-lang', code); } catch (e) {}
        buildTabs();
        render(activeCat);
      }

      function openMenu(open) {
        langMenu.hidden = !open;
        langBtn.setAttribute('aria-expanded', String(open));
      }
      langBtn.addEventListener('click', function (e) {
        e.stopPropagation();
        openMenu(langMenu.hidden);
      });
      document.addEventListener('click', function (e) {
        if (!e.target.closest('.lang-wrap')) openMenu(false);
      });
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') openMenu(false);
      });
      langMenu.querySelectorAll('button[data-lang]').forEach(function (b) {
        b.addEventListener('click', function () {
          applyLang(b.getAttribute('data-lang'));
          openMenu(false);
          langBtn.focus();
        });
      });

      toggle.addEventListener('click', function () {
        theme = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        applyTheme(theme);
      });

      var storedLang = null;
      try { storedLang = localStorage.getItem('oo-design-lang'); } catch (e) {}
      var initLang = LANGS.some(function (l) { return l.code === storedLang; }) ? storedLang : 'zh-Hans';
      applyLang(initLang);

      // 页面级 reveal
      var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var items = document.querySelectorAll('.reveal');
      if (reduce || !('IntersectionObserver' in window)) {
        items.forEach(function (el) { el.classList.add('in'); });
      } else {
        var io = new IntersectionObserver(function (entries) {
          entries.forEach(function (entry) {
            if (entry.isIntersecting) { entry.target.classList.add('in'); io.unobserve(entry.target); }
          });
        }, { threshold: 0.12 });
        items.forEach(function (el) { io.observe(el); });
      }
    })();
  </script>
</body>
</html>
